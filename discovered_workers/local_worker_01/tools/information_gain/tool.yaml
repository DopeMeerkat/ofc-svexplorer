id: information_gain
version: 1.0.0
display_name: Information Gain
description: >
  Computes information gain for each feature against a target column.
  Features with higher information gain are more predictive of the target.
entrypoint:
  command: python run.py
inputs:
  input_path:
    type: file
    required: true
    description: Path to input CSV with features and target column.
  output_dir:
    type: string
    required: true
    description: Directory where output files will be written.
  target_column:
    type: string
    required: false
    default: null
    description: Name of the target column. Defaults to the last column.
outputs:
  metrics:
    path: metrics.json
    type: json
    description: Execution metadata and top feature scores.
  feature_ranking:
    path: feature_ranking.csv
    type: csv
    description: Features sorted by information gain descending.
  results:
    path: results.csv
    type: csv
    description: Echoed copy of the input data.
  plot:
    path: plot.json
    type: plotly_json
    description: Interactive horizontal bar chart of information gain scores.
constraints:
  requires_gpu: false
  max_runtime_seconds: 120
